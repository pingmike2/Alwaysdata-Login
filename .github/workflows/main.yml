name: Alwaysdata Auto Login

on:
  workflow_dispatch:

  schedule:
    # 每月1号和16号 UTC 00:00
    - cron: '0 18 1,16 * *'

permissions:
  contents: write

jobs:
  login:
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Login Script
        env:
          ALWAYSDATA_USER: ${{ secrets.ALWAYSDATA_USER }}
          ALWAYSDATA_PASS: ${{ secrets.ALWAYSDATA_PASS }}
        run: |
          python login.py

      - name: Update time.txt
        run: |
          echo "$(date '+%Y-%m-%d %H:%M:%S UTC')" > time.txt

      - name: Commit time.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add time.txt

          if git diff --cached --quiet; then
            echo "无变化，无需提交"
          else
            git commit -m "⏱️ Update time.txt"
            git push
          fi